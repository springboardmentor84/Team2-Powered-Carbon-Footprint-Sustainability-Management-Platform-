<div class="dashboard">

  <!-- Welcome -->
  <div class="welcome-card">

    <div>
      <h1>Welcome Back 👋</h1>
      <p>
        Monitor your sustainability journey and reduce your carbon footprint.
      </p>
    </div>

    <button
      class="primary-btn"
      (click)="openDialog()">
      + Add Activity
    </button>

  </div>

  <!-- Stats -->
  <section class="stats">

    <mat-card
      class="stat-card"
      *ngFor="let item of stats; let i = index"
      [style.animation-delay]="(i * 0.15) + 's'">

      <div
        class="icon"
        [style.background]="item.color">

        <mat-icon>{{ item.icon }}</mat-icon>

      </div>

      <div>

        <h2>{{ item.value }}</h2>

        <p>{{ item.title }}</p>

        <small>{{ item.subtitle }}</small>

      </div>

    </mat-card>

  </section>

  <!-- Dashboard Grid -->
  <section class="dashboard-grid">

    <!-- Weekly Chart -->
    <mat-card class="large-card">

      <h2>Weekly Carbon Savings</h2>

      <div class="chart-container">
        <canvas #carbonChart></canvas>
      </div>

    </mat-card>

    <app-monthly-chart></app-monthly-chart>

    <app-sustainability-score></app-sustainability-score>

    <app-goal-progress></app-goal-progress>

    <app-recent-activities></app-recent-activities>

    <app-calendar-card></app-calendar-card>

    <app-notification-card></app-notification-card>

    <app-ai-recommendation></app-ai-recommendation>

    <app-quick-actions></app-quick-actions>

    <app-profile-widget></app-profile-widget>

    <app-achievement-card></app-achievement-card>

    <app-streak-card></app-streak-card>

    <app-weather-card></app-weather-card>

  </section>

</div>
