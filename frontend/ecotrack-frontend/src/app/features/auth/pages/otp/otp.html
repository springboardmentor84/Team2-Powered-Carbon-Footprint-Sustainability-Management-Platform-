<div class="auth-page">

  <div class="auth-card">

    <div class="auth-header">

      <div class="icon-circle">
        🔐
      </div>

      <h1>Verify OTP</h1>

      <p>
        Enter the 6-digit OTP sent to your registered email address.
      </p>

      <p class="email-display">
        {{ email }}
      </p>

    </div>

    <div
      class="message success-message"
      *ngIf="successMessage"
    >
      {{ successMessage }}
    </div>

    <div
      class="message error-message"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </div>

    <form
      (ngSubmit)="verifyOtp()"
      #otpForm="ngForm"
    >

      <div class="form-group">

        <label for="otp">
          Enter OTP
        </label>

        <input
          id="otp"
          type="text"
          name="otp"
          [(ngModel)]="otp"
          required
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="Enter 6-digit OTP"
          [disabled]="loading"
        />

      </div>

      <button
        type="submit"
        class="primary-btn"
        [disabled]="loading || otpForm.invalid"
      >
        {{
          loading
            ? 'Verifying...'
            : 'Verify OTP'
        }}
      </button>

    </form>

    <button
      type="button"
      class="back-btn"
      (click)="goBack()"
      [disabled]="loading"
    >
      ← Back
    </button>

  </div>

</div>
