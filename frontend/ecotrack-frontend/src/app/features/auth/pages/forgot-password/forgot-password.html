<div class="auth-page">

  <div class="auth-card">

    <div class="auth-header">

      <div class="icon-circle">
        🔐
      </div>

      <h1>Forgot Password?</h1>

      <p>
        Enter your registered email address and we'll
        send you an OTP to reset your password.
      </p>

    </div>


    <div
      class="message success-message"
      *ngIf="successMessage"
    >
      {{ successMessage }}
    </div>


    <div
      class="message error-message"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </div>


    <form
      (ngSubmit)="submit()"
      #forgotPasswordForm="ngForm"
    >

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          placeholder="Enter your registered email"
          [disabled]="loading"
        />

      </div>


      <button
        type="submit"
        class="primary-btn"
        [disabled]="loading || forgotPasswordForm.invalid"
      >

        {{
          loading
            ? 'Sending OTP...'
            : 'Send OTP'
        }}

      </button>

    </form>


    <button
      type="button"
      class="back-btn"
      (click)="goToLogin()"
      [disabled]="loading"
    >
      ← Back to Login
    </button>

  </div>

</div>
