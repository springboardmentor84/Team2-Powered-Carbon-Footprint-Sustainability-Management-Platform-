<div class="auth-page">

  <div class="auth-card">

    <div class="auth-header">

      <div class="icon-circle">
        🔑
      </div>

      <h1>Reset Password</h1>

      <p>
        Create a new password for your EcoTrack account.
      </p>

    </div>

    <div
      class="message success-message"
      *ngIf="successMessage"
    >
      {{ successMessage }}
    </div>

    <div
      class="message error-message"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </div>

    <form
      (ngSubmit)="resetPassword()"
      #resetForm="ngForm"
    >

      <div class="form-group">

        <label for="newPassword">
          New Password
        </label>

        <input
          id="newPassword"
          type="password"
          name="newPassword"
          [(ngModel)]="newPassword"
          required
          minlength="6"
          autocomplete="new-password"
          placeholder="Enter new password"
          [disabled]="loading"
        />

      </div>

      <div class="form-group">

        <label for="confirmPassword">
          Confirm New Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          minlength="6"
          autocomplete="new-password"
          placeholder="Confirm new password"
          [disabled]="loading"
        />

      </div>

      <button
        type="submit"
        class="primary-btn"
        [disabled]="loading || resetForm.invalid"
      >
        {{
          loading
            ? 'Resetting Password...'
            : 'Reset Password'
        }}
      </button>

    </form>

    <button
      type="button"
      class="back-btn"
      (click)="goBack()"
      [disabled]="loading"
    >
      ← Back to OTP
    </button>

  </div>

</div>
