<div class="summary-grid">

    <mat-card
        class="card"
        *ngFor="let card of cards">

        <div
            class="top-bar"
            [style.background]="card.color">

        </div>

        <div class="icon">

            {{card.icon}}

        </div>

        <h2>

            {{card.value}}

        </h2>

        <p>

            {{card.title}}

        </p>

    </mat-card>

</div>
