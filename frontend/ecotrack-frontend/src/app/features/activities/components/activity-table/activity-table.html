<mat-card>

  <h2>Activity History</h2>

  <div class="toolbar">

    <mat-form-field appearance="outline">

      <mat-label>Search</mat-label>

      <input
        matInput
        [(ngModel)]="search"
        (ngModelChange)="loadData()">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>Category</mat-label>

      <mat-select
        [(ngModel)]="selectedCategory"
        (selectionChange)="loadData()">

        <mat-option
          *ngFor="let c of categories"
          [value]="c">

          {{ c }}

        </mat-option>

      </mat-select>

    </mat-form-field>
<mat-form-field appearance="outline">

  <mat-label>Date</mat-label>

  <input
    matInput
    type="date"
    [(ngModel)]="selectedDate"
    (ngModelChange)="loadData()">

</mat-form-field>
<mat-form-field appearance="outline">

  <mat-label>Minimum Carbon</mat-label>

  <input
    matInput
    type="number"
    [(ngModel)]="minCarbon"
    (ngModelChange)="loadData()">

</mat-form-field>
    <button
      mat-raised-button
      color="primary"
      (click)="exportCSV()">

      Export CSV

    </button>

  </div>

  <table
    mat-table
    [dataSource]="dataSource"
    matSort>

    <!-- Activity -->

    <ng-container matColumnDef="activity">

      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header>

        Activity

      </th>

      <td
        mat-cell
        *matCellDef="let row">

        {{ row.title }}

      </td>

    </ng-container>

    <!-- Category -->

    <ng-container matColumnDef="category">

      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header>

        Category

      </th>

      <td
        mat-cell
        *matCellDef="let row">

        {{ row.category }}

      </td>

    </ng-container>

    <!-- Carbon -->

    <ng-container matColumnDef="carbonSaved">

      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header>

        Carbon Saved

      </th>

      <td
        mat-cell
        *matCellDef="let row">

        {{ row.carbon }} kg

      </td>

    </ng-container>

    <!-- Date -->

    <ng-container matColumnDef="date">

      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header>

        Date

      </th>

      <td
        mat-cell
        *matCellDef="let row">

        {{ row.date }}

      </td>

    </ng-container>

    <!-- Notes -->

    <ng-container matColumnDef="status">

      <th
        mat-header-cell
        *matHeaderCellDef>

        Notes

      </th>

      <td
        mat-cell
        *matCellDef="let row">

        {{ row.notes }}

      </td>

    </ng-container>

    <!-- Actions -->

    <ng-container matColumnDef="action">

      <th
        mat-header-cell
        *matHeaderCellDef>

        Action

      </th>

      <td
        mat-cell
        *matCellDef="let row">

        <button
          mat-icon-button
          color="primary"
          (click)="edit(row)">

          <mat-icon>edit</mat-icon>

        </button>

        <button
          mat-icon-button
          color="warn"
          (click)="delete(row)">

          <mat-icon>delete</mat-icon>

        </button>

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">

    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns">

    </tr>

  </table>

 <mat-paginator

[pageSize]="5"

[pageSizeOptions]="[5,10,20]"

showFirstLastButtons>

</mat-paginator>

<div
class="empty-state"
*ngIf="dataSource.data.length==0">

<h3>No Activities Found</h3>

<p>

Try changing the filters or add a new activity.

</p>

</div>

</mat-card>
