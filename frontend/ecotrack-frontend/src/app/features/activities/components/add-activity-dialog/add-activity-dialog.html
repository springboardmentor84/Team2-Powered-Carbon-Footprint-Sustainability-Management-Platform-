<h2 mat-dialog-title>

  {{ isEditMode ? 'Edit Activity' : 'Add Activity' }}

</h2>


<mat-dialog-content>


  <!-- CATEGORY -->

  <mat-form-field
    appearance="outline"
    class="full-width">

    <mat-label>
      Category
    </mat-label>

    <mat-select
      [(ngModel)]="category">

      @for (
        item of categories;
        track item.value
      ) {

        <mat-option
          [value]="item.value">

          {{ item.label }}

        </mat-option>

      }

    </mat-select>

  </mat-form-field>



  <!-- ACTIVITY -->

  <mat-form-field
    appearance="outline"
    class="full-width">

    <mat-label>
      Activity
    </mat-label>

    <input
      matInput
      [(ngModel)]="activity"
      placeholder="Example: Car Travel">

  </mat-form-field>



  <!-- QUANTITY -->

  <mat-form-field
    appearance="outline"
    class="full-width">

    <mat-label>
      Quantity
    </mat-label>

    <input
      matInput
      type="number"
      min="0"
      step="0.01"
      [(ngModel)]="quantity">

  </mat-form-field>



  <!-- UNIT -->

  <mat-form-field
    appearance="outline"
    class="full-width">

    <mat-label>
      Unit
    </mat-label>

    <mat-select
      [(ngModel)]="unit">

      @for (
        item of units;
        track item
      ) {

        <mat-option
          [value]="item">

          {{ item }}

        </mat-option>

      }

    </mat-select>

  </mat-form-field>



  <!-- ERROR -->

  @if (errorMessage) {

    <div class="error-message">

      {{ errorMessage }}

    </div>

  }


</mat-dialog-content>



<mat-dialog-actions align="end">


  <button
    mat-button
    type="button"
    (click)="cancel()"
    [disabled]="saving">

    Cancel

  </button>


  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="saving">

    @if (saving) {

      Saving...

    }

    @else {

      {{ isEditMode ? 'Update Activity' : 'Save Activity' }}

    }

  </button>


</mat-dialog-actions>
