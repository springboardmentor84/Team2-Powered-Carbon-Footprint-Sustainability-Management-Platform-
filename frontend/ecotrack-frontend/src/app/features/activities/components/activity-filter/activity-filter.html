<div class="filter-card">

    <mat-form-field appearance="outline">

        <mat-label>Search Activity</mat-label>

        <input
            matInput
            [(ngModel)]="search"
            (keyup)="applyFilters()">

    </mat-form-field>

    <mat-form-field appearance="outline">

        <mat-label>Category</mat-label>

        <mat-select
            [(ngModel)]="category"
            (selectionChange)="applyFilters()">

            <mat-option value="">

                All

            </mat-option>

            <mat-option
                *ngFor="let item of categories"
                [value]="item">

                {{item}}

            </mat-option>

        </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">

        <mat-label>Sort</mat-label>

        <mat-select
            [(ngModel)]="sort"
            (selectionChange)="applyFilters()">

            <mat-option value="latest">

                Latest

            </mat-option>

            <mat-option value="oldest">

                Oldest

            </mat-option>

            <mat-option value="carbon-high">

                Carbon High

            </mat-option>

            <mat-option value="carbon-low">

                Carbon Low

            </mat-option>

        </mat-select>

    </mat-form-field>

    <button
        mat-raised-button
        color="primary"
        (click)="reset()">

        Reset

    </button>

</div>
