<mat-card class="card">

  <div class="header">

    <div>

      <h2>Sustainability Score</h2>

      <p>
        Based on your logged activities
      </p>

    </div>

    <div class="score-circle">

      <span>
        {{ score }}
      </span>

      <small>/100</small>

    </div>

  </div>


  <div class="progress-area">

    <div class="progress-track">

      <div
        class="progress-fill"
        [style.width.%]="score">
      </div>

    </div>

    <div class="progress-labels">

      <span>
        Current Score
      </span>

      <strong>
        {{ score }}%
      </strong>

    </div>

  </div>


  <div
    class="status"
    [class.good]="score >= 70"
    [class.medium]="score >= 40 && score < 70"
    [class.low]="score < 40">

    <span
      *ngIf="score >= 70">

      Excellent sustainability performance 🌱

    </span>

    <span
      *ngIf="score >= 40 && score < 70">

      Good progress — keep improving 🌿

    </span>

    <span
      *ngIf="score < 40">

      Start logging sustainable activities 🌱

    </span>

  </div>

</mat-card>
