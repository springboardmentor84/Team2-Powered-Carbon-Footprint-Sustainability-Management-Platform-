<div class="ai-recommendation">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <div class="header">

    <div>

      <span class="ai-label">
        AI POWERED
      </span>

      <h2>
        AI Recommendation
      </h2>

    </div>


    <button
      type="button"
      class="refresh"
      aria-label="Refresh AI recommendation"
      [disabled]="loading"
      (click)="refreshRecommendation()">

      <mat-icon>
        refresh
      </mat-icon>

    </button>

  </div>


  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div
    class="ai-state"
    *ngIf="loading">

    <mat-icon>
      auto_awesome
    </mat-icon>

    <span>
      Analysing your sustainability data...
    </span>

  </div>


  <!-- =====================================================
       ERROR
       ===================================================== -->

  <div
    class="ai-state error"
    *ngIf="
      !loading &&
      error
    ">

    <mat-icon>
      info
    </mat-icon>

    <h3>
      AI recommendation unavailable
    </h3>

    <p>
      The recommendation service could not be reached.
    </p>

    <button
      type="button"
      class="retry"
      (click)="refreshRecommendation()">

      Try Again

    </button>

  </div>


  <!-- =====================================================
       RECOMMENDATION
       ===================================================== -->

  <div
    class="content"
    *ngIf="
      !loading &&
      !error &&
      recommendation
    ">


    <div class="emoji">

      {{ icon }}

    </div>


    <div class="details">

      <div class="category">
        {{ category | titlecase }}
      </div>


      <h3>
        {{ title }}
      </h3>


      <p>
        {{ text }}
      </p>


      <div
        class="reason"
        *ngIf="reason">

        {{ reason }}

      </div>


      <div class="meta">

        <span
          class="priority"
          [class.high]="priority === 'HIGH'"
          [class.medium]="priority === 'MEDIUM'"
          [class.low]="priority === 'LOW'">

          {{ priority }}
          Priority

        </span>


        <span class="live">

          <span class="live-dot"></span>

          Live AI insight

        </span>

      </div>

    </div>

  </div>

</div>
