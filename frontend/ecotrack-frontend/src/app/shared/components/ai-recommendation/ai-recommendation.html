<mat-card class="card">

    <h2>

        AI Recommendation

    </h2>

    <div class="content">

        <div class="emoji">

            {{recommendation.icon}}

        </div>

        <div>

            <h3>

                {{recommendation.title}}

            </h3>

            <p>

                {{recommendation.text}}

            </p>

            <div class="saving">

                {{recommendation.saving}}

            </div>

        </div>

    </div>

</mat-card>
