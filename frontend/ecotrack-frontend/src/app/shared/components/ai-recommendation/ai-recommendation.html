<div class="ai-recommendation">

  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div
    class="ai-state skeleton-container"
    *ngIf="loading">

    <div class="skeleton-icon"></div>

    <div class="skeleton-details">

      <div
        class="skeleton-line category-line">
      </div>

      <div
        class="skeleton-line title-line">
      </div>

      <div
        class="skeleton-line text-line">
      </div>

      <div
        class="skeleton-line text-line-short">
      </div>

      <div class="skeleton-meta">

        <div
          class="skeleton-badge">
        </div>

        <div
          class="skeleton-badge">
        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       ERROR
       ===================================================== -->

  <div
    class="ai-state error"
    *ngIf="
      !loading &&
      error
    ">

    <mat-icon>
      info
    </mat-icon>

    <h3>
      AI recommendation unavailable
    </h3>

    <p>
      The recommendation service could not be reached.
    </p>

    <button
      type="button"
      class="retry"
      (click)="refreshRecommendation()">

      Try Again

    </button>

  </div>


  <!-- =====================================================
       RECOMMENDATION
       ===================================================== -->

  <div
    class="content"
    *ngIf="
      !loading &&
      !error &&
      recommendation
    ">


    <div class="emoji">

      {{ icon }}

    </div>


    <div class="details">


      <div class="category">

        {{ category | titlecase }}

      </div>


      <h3>

        {{ title }}

      </h3>


      <p>

        {{ text }}

      </p>


      <div
        class="reason"
        *ngIf="reason">

        {{ reason }}

      </div>


      <div class="meta">


        <span
          class="priority"
          [class.high]="priority === 'HIGH'"
          [class.medium]="priority === 'MEDIUM'"
          [class.low]="priority === 'LOW'">

          {{ priority }}
          Priority

        </span>


        <!-- Live AI -->

        <span
          class="live"
          *ngIf="!usingFallback">

          <span
            class="live-dot">
          </span>

          Live AI insight

        </span>


        <!-- Fallback -->

        <span
          class="live"
          *ngIf="usingFallback">

          <span
            class="live-dot">
          </span>

          Sustainability insight

        </span>


      </div>

    </div>

  </div>

</div>
