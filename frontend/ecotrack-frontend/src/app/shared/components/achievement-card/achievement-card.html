<mat-card class="card">

<h2>

Achievements

</h2>

<div class="count">

Unlocked

<strong>

{{unlockedCount}} / {{badges.length}}

</strong>

</div>

<div class="grid">

<div

class="badge"

*ngFor="let badge of badges"

[class.locked]="!badge.unlocked">

<div class="icon">

{{badge.icon}}

</div>

<h3>

{{badge.title}}

</h3>

<p>

{{badge.desc}}

</p>

<span *ngIf="badge.unlocked">

Unlocked

</span>

<span *ngIf="!badge.unlocked">

Locked

</span>

</div>

</div>

</mat-card>
