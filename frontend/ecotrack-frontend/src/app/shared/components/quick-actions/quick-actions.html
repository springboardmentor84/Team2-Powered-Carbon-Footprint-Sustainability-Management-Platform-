<div class="grid">
    <div
        *ngFor="let action of actions"
        class="action"
        (click)="actionClick(action)">
        <div class="icon" [style.background]="action.color">
            <mat-icon>{{action.icon}}</mat-icon>
        </div>
        <span>{{action.title}}</span>
    </div>
</div>
