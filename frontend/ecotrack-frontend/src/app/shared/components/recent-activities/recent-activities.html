<mat-card class="card">

    <h2>Recent Activities</h2>

    <table>

        <thead>

            <tr>

                <th></th>

                <th>Activity</th>

                <th>Carbon Saved</th>

                <th>Date</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let activity of activities">

                <td class="icon">

                    {{getIcon(activity.category)}}

                </td>

                <td>

                    {{activity.title}}

                </td>

                <td>

                    {{activity.carbon}} kg

                </td>

                <td>

                    {{activity.date}}

                </td>

            </tr>

        </tbody>

    </table>

</mat-card>
