<div class="sidebar">

    <div class="logo">

        <mat-icon>eco</mat-icon>

        <span>EcoTrack</span>

    </div>

    <mat-nav-list>

        @for(item of menu; track item.route){

            <a
                mat-list-item
                [routerLink]="item.route"
                routerLinkActive="active">

                <mat-icon matListItemIcon>

                    {{item.icon}}

                </mat-icon>

                <span>

                    {{item.title}}

                </span>

            </a>

        }

    </mat-nav-list>

</div>
