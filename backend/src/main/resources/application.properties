spring.application.name=ecotrack-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/ecotrack
spring.datasource.username=${DB_USERNAME:fahadfurquan}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Import local developer configuration if it exists (e.g. for overriding secrets)
spring.config.import=optional:classpath:application-local.properties

# JWT Configuration
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=86400000

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# AI Integration
ai.api.key=${AI_API_KEY}
ai.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent