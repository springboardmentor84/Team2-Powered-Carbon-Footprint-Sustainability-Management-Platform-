# ============================================================
# PRODUCTION CONFIGURATION — EcoTrack Backend
# All values are injected via environment variables on Render
# ============================================================

# Database (Render PostgreSQL — DATABASE_URL provided by Render)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# JWT
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=86400000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# AI Integration
ai.api.key=${AI_API_KEY}
ai.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

# CORS — allow requests from Vercel frontend
spring.web.cors.allowed-origins=${FRONTEND_URL:https://ecotrack-frontend.vercel.app}
